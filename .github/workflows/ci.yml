name: CI

# PR and main: type check, unit tests and the web build (Expo export).
# main: image on GitHub Container Registry, :sha-<commit> and :main, under two names during the rename:
# ghcr.io/rr2000/food-calc-app (new, like the repo) and ghcr.io/rr2000/foodcalcfe (old).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rr2000/foodcalcfe:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/foodcalcfe:main
            ghcr.io/rr2000/food-calc-app:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/food-calc-app:main
          labels: |
            org.opencontainers.image.source=https://github.com/RR2000/food-calc-app
          cache-from: type=gha
          cache-to: type=gha,mode=max
